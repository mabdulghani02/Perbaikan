<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>AS - Administrasi Subang</title>

  <!-- Penambahan Kode Manifes dan Ikon -->
  <link rel="manifest" href="/manifest.json">
  <!-- Ikon Apple disesuaikan warnanya agar lebih cocok dengan mode gelap modern -->
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=AS&background=1e1e1e&color=8ab4f8&size=192">

  <link rel="stylesheet" href="style.css?v=2.0">
  <!-- Menggunakan FontAwesome terbaru untuk ikon-ikon yang lebih modern -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>

<body>

<!-- HEADER MOBILE (Logo bergaya modern/futuristik) -->
<div class="mobile-header">
  <div class="mobile-header-title">
    <i class="fa-solid fa-sparkles" style="color: #8ab4f8; margin-right: 5px;"></i> AS
  </div>
  <div style="display: flex; gap: 12px; align-items: center;">
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
      <i id="themeIcon" class="fa-solid fa-moon"></i>
    </button>
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Buka Menu">
      <i class="fa-solid fa-bars-staggered"></i> <!-- Ikon hamburger modern -->
    </button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <div style="display: flex; align-items: center; gap: 10px;">
        <i class="fa-solid fa-sparkles" style="color: #8ab4f8; font-size: 24px;"></i>
        <div>
          AS - SARI KEDELE
          <small>Administrasi Pintar</small>
        </div>
      </div>
      <button style="background:transparent; border:0; color:inherit; font-size:22px; cursor:pointer;" onclick="toggleSidebar()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Navigasi Sidebar Ditambah Halaman Khusus Pemantauan -->
    <div class="nav">
      <button data-page="dashboard" onclick="showPage('dashboard')"><i class="fa-solid fa-layer-group"></i> Dashboard</button>
      <button data-page="sales" onclick="showPage('sales')"><i class="fa-solid fa-arrow-trend-up"></i> Pendapatan</button>
      <button data-page="expense" onclick="showPage('expense')"><i class="fa-solid fa-arrow-trend-down"></i> Pengeluaran Utama</button>
      <button data-page="expense_tracker" onclick="showPage('expense_tracker')"><i class="fa-solid fa-money-bill-transfer"></i> Pantau Pengeluaran</button>
      <button data-page="attendance" onclick="showPage('attendance')"><i class="fa-solid fa-fingerprint"></i> Absensi</button>
      <button data-page="payroll" onclick="showPage('payroll')"><i class="fa-solid fa-wallet"></i> Daftar Gaji</button>
      <button data-page="limbah" onclick="showPage('limbah')"><i class="fa-solid fa-recycle"></i> Penjualan Limbah</button>
      <button data-page="settings" onclick="showPage('settings')"><i class="fa-solid fa-sliders"></i> Pengaturan Sistem</button>
    </div>
  </aside>

  <!-- KONTEN UTAMA (Wadah untuk halaman yang dirender JS dan animasi transisi) -->
  <main class="main">
    <div id="content" class="page-transition"></div>
  </main>
</div>

<!-- BOTTOM NAVIGATION BAR (Persis 5 Menu Tanpa Teks, Ikon Modern) -->
<nav class="bottom-nav">
  <button class="b-nav-btn" data-page="dashboard" onclick="showPage('dashboard')" aria-label="Dashboard">
    <i class="fa-solid fa-layer-group"></i>
  </button>
  <button class="b-nav-btn" data-page="sales" onclick="showPage('sales')" aria-label="Pendapatan">
    <i class="fa-solid fa-arrow-trend-up"></i>
  </button>
  <button class="b-nav-btn" data-page="expense" onclick="showPage('expense')" aria-label="Pengeluaran">
    <i class="fa-solid fa-arrow-trend-down"></i>
  </button>
  <button class="b-nav-btn" data-page="attendance" onclick="showPage('attendance')" aria-label="Absensi">
    <i class="fa-solid fa-fingerprint"></i>
  </button>
  <button class="b-nav-btn" data-page="payroll" onclick="showPage('payroll')" aria-label="Gaji">
    <i class="fa-solid fa-wallet"></i>
  </button>
</nav>

<!-- FLOATING ACTION BUTTON (Asisten AI) -->
<button class="fab-ai" onclick="showPage('aichat')" aria-label="Buka Asisten AI">
  <i class="fa-solid fa-sparkles"></i>
</button>

<!-- WADAH NOTIFIKASI -->
<div id="toast" class="toast"></div>

<!-- PEMANGGILAN SCRIPT UTAMA -->
<script src="app.js?v=2.0"></script>
  
<!-- Skrip Pendaftaran Pekerja Layanan -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</body>
</html>
